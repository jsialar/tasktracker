server {
  listen 80;
  root /usr/share/nginx/html;

  # Forward API calls to the backend container (same origin, so no CORS needed)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s; # creating tasks may wait on the LLM
  }

  # Single-page app: paths like /new have no file, so serve index.html and let React Router handle them
  location / {
    try_files $uri $uri/ /index.html;
  }
}
